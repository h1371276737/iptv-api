name: IPTV Source Update

on:
  # 手动触发
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v4
        with:
          ref: master

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: 💾 Cache pipenv
        uses: actions/cache@v4
        with:
          path: ~/.local/share/virtualenvs
          key: ${{ runner.os }}-pipenv-${{ hashFiles('Pipfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pipenv-

      - name: 📥 Install Dependencies
        run: |
          pip install pipenv
          pipenv install --deploy --dev

      - name: 🔄 Update Sources
        run: pipenv run dev
        env:
          TZ: Asia/Shanghai

      - name: ✅ Verify Output
        run: |
          ls -la output/
          du -h output/* 2>/dev/null || true

      - name: 📤 Commit Results
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add output/
          git add config/subscribe_disabled.txt 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "🤖 Auto-update [$(date '+%Y-%m-%d %H:%M')]"
            git push
          else
            echo "🟡 No changes"
          fi
